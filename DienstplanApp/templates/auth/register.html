{% extends "base.html" %}

{% block header %}
    <h2>Registrieren</h2>
{% endblock header %}

{% block content %}
    <form action="" method="post">
        <input type="text" name="firstname" id="firstname" placeholder="Vorname"  value="{{ form_data.get('firstname','') }}" required>
        <input type="text" name="lastname" id="lastname" placeholder="Nachname"  value="{{form_data.get('lastname', '')}}" required>

        <input type="email" name="email" id="email" placeholder="Email Adresse"  value="{{ form_data.get('email','')}}" required>
        <input type="email" name="confirm-email" id="confirm-email" placeholder="Email Adresse bestätigen"  value="{{ form_data.get('confirm-email','') }}" required>

        <input type="password" name="password" id="password" placeholder="Passwort" required>
        <input type="password" name="confirm-password" id="confirm-password" placeholder="Passwort bestätigen" required>

        <input type="text" name="invite-code" id="invite-code" placeholder="Einladungscode (optional)">
        
        <input type="checkbox" name="dsgvo" id="dsgvo" value="dsgvo-accepted" required>
        <label for="dsgvo"><a href="/dsgvo">DSGVO</a> gelesen und akzeptiert</label>
        
        <input type="checkbox" name="agb" id="agb" value="agb-accepted" required>
        <label for="agb"><a href="/agb">AGB</a> gelesen und akzeptiert</label>

        <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
        
        <button type="submit">Registrieren</button>
    </form>
{% endblock content %}
