{% extends "base.html" %}
{% block header %}<h2>Support kontaktieren</h2>{% endblock header %}

{% block content %}
    <p>Gibt es ein Problem mit dem Dienstplan? Beschreibe es kurz, der Admin kümmert sich darum.</p>
    <form action="{{ url_for('info.support') }}" method="POST">
        <div>
            <label for="message">Deine Nachricht (nur Text):</label>
            <!-- textarea erlaubt mehrzeiligen Text. Kein HTML-Editor integriert (Sicherheit!) -->
            <textarea name="message" id="message" rows="6" style="width: 100%; max-width: 500px;" required></textarea>
        </div>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Nachricht sicher senden</button>
    </form>
{% endblock content %}
